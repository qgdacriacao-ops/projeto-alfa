<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "vxqqwilkqh");
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Pleno | O Código</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --bg-black: #000; --white: #fff; --glow: rgba(255, 215, 0, 0.6); --red: #CC0000; --ice-gray: #E8EAEB; --chumbo: #2C2C2C; --text-dark: #1A1A1A; --border: #D1D1D1; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { min-height: 100%; background-color: var(--bg-black); font-family: 'Inter', sans-serif; overflow-x: hidden !important; width: 100%; touch-action: pan-y; }
        header { background: #000; padding: 0 5%; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; width: 100%; z-index: 2000; height: 85px; border-bottom: 2px solid var(--gold); }
        .logo { display: flex; align-items: center; gap: 15px; color: #fff; font-weight: 700; text-transform: uppercase; font-size: 0.9rem; }
        .logo img { height: 60px; }
        nav ul { list-style: none; display: flex; gap: 20px; align-items: center; }
        nav a { text-decoration: none; color: #fff; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; cursor: pointer; border-bottom: 2px solid transparent; padding-bottom: 5px; }
        nav a.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        #bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('capa.webp') no-repeat center center; background-size: cover; z-index: 1; filter: brightness(0.4); }
        main { position: relative; z-index: 10; padding-top: 85px; width: 100%; }
        .view-home { min-height: calc(100vh - 85px); display: flex; justify-content: space-between; align-items: center; padding: 0 5%; gap: 20px; }
        .column-box { width: 300px; text-align: center; }
        .display-box { width: 100%; height: 420px; cursor: pointer; }
        .display-box img { width: 100%; height: 100%; object-fit: contain; }
        .hero-center { flex: 1; text-align: center; }
        .hero-center h1 { color: #fff; font-size: clamp(1.1rem, 4.5vw, 2.2rem); text-transform: uppercase; }
        .line-hero { width: 85%; height: 5px; background: var(--gold); margin: 15px auto; box-shadow: 0 0 20px var(--gold); }
        .view-info-extra { display: none; width: 100%; }
        .sobre-container-flex { display: flex; align-items: center; gap: 40px; padding: 40px; background: rgba(0,0,0,0.85); border: 1px solid var(--gold); margin: 40px auto; max-width: 1000px; color: #fff; }
        .foto-autor-img { width: 300px; height: auto; border-radius: 10px; border: 2px solid var(--gold); }
        @media (max-width: 768px) {
            .view-home { flex-direction: column; padding: 40px 5%; }
            .sobre-container-flex { flex-direction: column; text-align: center; }
            .foto-autor-img { width: 220px; }
        }
    </style>
</head>
<body>
    <div id="bg"></div>
    <header>
        <div class="logo"><img src="selo.png"><span>Portal Pleno | O Código</span></div>
        <nav>
            <ul>
                <li><a id="nav-home" class="active" onclick="irHome()">Início</a></li>
                <li><a id="nav-sobre" onclick="abrirInfo('sobre')">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="view-home" class="view-home">
            <div class="column-box">
                <p style="color:var(--gold); font-weight:700; letter-spacing:2px;">EBOOKS</p>
                <div class="display-box"><img id="loop-e" src="ebook04.webp"></div>
            </div>
            <div class="hero-center">
                <h1>Soberania intelectual e alto desempenho mental.</h1>
                <div class="line-hero"></div>
            </div>
            <div class="column-box">
                <p style="color:var(--gold); font-weight:700; letter-spacing:2px;">AUDIOBOOKS</p>
                <div class="display-box"><img id="loop-a" src="audio04.webp"></div>
            </div>
        </div>
        <section id="view-info-extra" class="view-info-extra">
            <div id="content-info"></div>
        </section>
    </main>

    <script>
        const hardware = {
            e: [
                {img: 'ebook04.webp'}, {img: 'ebook05.webp'}, {img: 'ebook06.webp'}
            ],
            a: [
                {img: 'audio04.webp'}, {img: 'audio05.webp'}
            ]
        };

        function resetTelas() {
            document.getElementById('view-home').style.display = 'none';
            document.getElementById('view-info-extra').style.display = 'none';
            window.scrollTo(0,0);
        }

        function irHome() {
            resetTelas();
            document.getElementById('view-home').style.display = 'flex';
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            document.getElementById('nav-home').classList.add('active');
        }

        function abrirInfo(tipo) {
            resetTelas();
            const container = document.getElementById('content-info');
            document.getElementById('view-info-extra').style.display = 'block';
            
            if (tipo === 'sobre') {
                document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
                document.getElementById('nav-sobre').classList.add('active');
                container.innerHTML = `
                <div class="sobre-container-flex">
                    <img src="foto_autor.webp" alt="Júlio Bhrósz" class="foto-autor-img">
                    <div class="sobre-texto">
                        <h1 style="color: var(--gold); margin-bottom: 20px;">A Mente por trás d'O Código</h1>
                        <p style="line-height: 1.6; margin-bottom: 15px;">Por trás de cada técnica e estratégia apresentada, está a experiência de <strong>Júlio Bhrósz</strong>.</p>
                        <p style="line-height: 1.6;">Com mais de 15 anos dedicados ao estudo profundo do comportamento humano, Júlio desenvolveu uma metodologia desenhada para a <strong>soberania intelectual</strong>.</p>
                        <div style="font-style: italic; border-left: 4px solid var(--gold); padding-left: 15px; margin-top: 25px; color: #eee;">
                            "O Código não é apenas um livro, é a chave para a liberdade mental."
                        </div>
                    </div>
                </div>`;
            }
        }

        // CARROSSEL (Garantindo que rode após carregar)
        let iE = 0; 
        setInterval(() => { 
            iE = (iE + 1) % hardware.e.length; 
            const imgE = document.getElementById('loop-e');
            if(imgE) imgE.src = hardware.e[iE].img; 
        }, 3000);

        let iA = 0; 
        setInterval(() => { 
            iA = (iA + 1) % hardware.a.length; 
            const imgA = document.getElementById('loop-a');
            if(imgA) imgA.src = hardware.a[iA].img; 
        }, 3000);

        window.onload = irHome;
    </script>
</body>
</html>
