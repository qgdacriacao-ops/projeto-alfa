<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "vxqqwilkqh");
    </script>

      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pleno | O Código</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           VARIÁVEIS GLOBAIS
        ============================================================ */
        :root {
            --gold: #FFD700;
            --bg-black: #000;
            --white: #fff;
            --bg-light: #f9f9f9;
            --red-btn: #d30000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-black);
            color: var(--white);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- ESTILOS DO PRELOADER (TELA PRETA) --- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 9999;
            opacity: 1;
            visibility: visible;
            transition: opacity 1s ease, visibility 1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
        }

        #preloader.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- CANVAS DA ANIMAÇÃO (CIRÚRGICO) --- */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* --- NAVEGAÇÃO --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            margin-left: 40px;
            font-size: 0.85rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* --- ÁREA DE CONTEÚDO DINÂMICO --- */
        #content-area {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
        }

        /* --- ESTILOS DA HOME --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 7rem;
            color: var(--gold);
            margin: 0;
            line-height: 0.9;
            letter-spacing: -2px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.5s forwards 1.2s;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 650px;
            color: rgba(255, 255, 255, 0.7);
            margin: 30px 0 50px 0;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeIn 2s forwards 2s;
        }

        .btn-portal {
            padding: 20px 50px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.9rem;
            transition: all 0.5s ease;
            opacity: 0;
            animation: fadeIn 2s forwards 2.5s;
        }

        .btn-portal:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        /* --- PÁGINA SOBRE (MODERNA) --- */
        .sobre-container {
            padding: 150px 50px;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 100px;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sobre-img {
            width: 100%;
            height: 600px;
            background: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=80') no-repeat center center;
            background-size: cover;
            border: 1px solid rgba(255, 215, 0, 0.2);
            filter: grayscale(1) contrast(1.2);
        }

        .sobre-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 40px;
        }

        .sobre-text p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            text-align: justify;
        }

        /* --- PÁGINA CONTATO (NEUMORFISMO DARK) --- */
        .contato-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
        }

        .contato-card {
            background: #050505;
            padding: 80px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        .contato-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .contato-links {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        /* --- SUPORTE CLEAN --- */
        .suporte-clean {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .suporte-fundo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .suporte-content {
            z-index: 2;
            text-align: center;
        }

        .suporte-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            color: var(--gold);
            margin-bottom: 50px;
            letter-spacing: 5px;
        }

        .suporte-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            padding: 60px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 2px;
            display: inline-block;
        }

        .suporte-label {
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .suporte-email {
            font-size: 1.5rem;
            color: var(--gold);
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .suporte-email:hover {
            letter-spacing: 3px;
        }

        /* --- ANIMAÇÕES --- */
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 1024px) {
            .hero h1 { font-size: 5rem; }
            .sobre-container { grid-template-columns: 1fr; gap: 50px; padding: 100px 20px; }
        }

        @media (max-width: 768px) {
            nav { padding: 20px; }
            .nav-links { display: none; }
            .hero h1 { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <div id="preloader">
        <span>Conectando ao Portal...</span>
    </div>

    <nav>
        <a href="javascript:void(0)" onclick="irHome()" class="logo">Portal Pleno</a>
        <div class="nav-links">
            <a href="javascript:void(0)" onclick="irSobre()">Metodologia</a>
            <a href="javascript:void(0)" onclick="abrirInfo('contato')">Contato</a>
            <a href="javascript:void(0)" onclick="abrirInfo('suporte')">Suporte Alunos</a>
        </div>
    </nav>

    <div id="canvas-container"></div>

    <main id="content-area"></main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, stars, starGeo;
        let historico = 'home';

        // INICIALIZA ANIMAÇÃO STARS (THREE.JS)
        function initAnimation() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 1;
            camera.rotation.x = Math.PI/2;

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            starGeo = new THREE.BufferGeometry();
            let positions = [];
            for(let i=0; i<6000; i++) {
                positions.push(
                    Math.random() * 600 - 300,
                    Math.random() * 600 - 300,
                    Math.random() * 600 - 300
                );
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

            let sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');
            let starMaterial = new THREE.PointsMaterial({
                color: 0xffd700,
                size: 0.7,
                map: sprite,
                transparent: true
            });

            stars = new THREE.Points(starGeo, starMaterial);
            scene.add(stars);

            animate();
        }

        function animate() {
            let positions = starGeo.attributes.position.array;
            for(let i=0; i<6000; i++) {
                positions[i*3+1] -= 0.9;
                if(positions[i*3+1] < -300) {
                    positions[i*3+1] = 300;
                }
            }
            starGeo.attributes.position.needsUpdate = true;
            stars.rotation.y += 0.002;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // SISTEMA DE NAVEGAÇÃO SINGLE PAGE
        function irHome() {
            const container = document.getElementById('content-area');
            container.innerHTML = `
                <section class="hero">
                    <h1>O CÓDIGO</h1>
                    <p>A Engenharia de Comportamento para quem busca Soberania Intelectual e Domínio Mental em um mundo de distração constante.</p>
                    <a href="javascript:void(0)" onclick="irSobre()" class="btn-portal">Iniciar Transcendência</a>
                </section>
            `;
            historico = 'home';
        }

        function irSobre() {
            const container = document.getElementById('content-area');
            container.innerHTML = `
                <div class=\"sobre-container\">
                    <div class=\"sobre-img\"></div>
                    <div class=\"sobre-text\">
                        <h2>Soberania Intelectual</h2>
                        <p>O Portal Pleno não é apenas um curso. É um centro de treinamento para a mente. Nossa metodologia foca na reestruturação dos processos cognitivos através da engenharia comportamental aplicada.</p>
                        <p>Aprenda a blindar sua atenção, gerenciar seu foco e retomar o controle da sua biologia contra os algoritmos modernos.</p>
                        <a href=\"javascript:void(0)\" onclick=\"abrirInfo('contato')\" class=\"btn-portal\" style=\"animation: none; opacity: 1;\">Acessar Treinamento</a>
                    </div>
                </div>
            `;
            window.scrollTo(0, 0);
            historico = 'sobre';
        }

        function abrirInfo(tipo) {
            const container = document.getElementById('content-area');
            if(tipo === 'contato') {
                container.innerHTML = `
                    <div class=\"contato-wrapper\">
                        <div class=\"contato-card\">
                            <h2>Fale com o QG</h2>
                            <p>Dúvidas sobre o portal, mentorias ou parcerias estratégicas.</p>
                            <div class=\"contato-links\">
                                <a href=\"https://wa.me/5500000000000\" target=\"_blank\" style=\"color: var(--gold); text-decoration: none; font-size: 1.2rem;\">🟢 WhatsApp</a>
                                <a href=\"https://youtube.com\" target=\"_blank\" style=\"color: var(--gold); text-decoration: none; font-size: 1.2rem;\">🔴 YouTube</a>
                                <a href=\"https://linkedin.com\" target=\"_blank\" style=\"color: var(--gold); text-decoration: none; font-size: 1.2rem;\">💼 LinkedIn</a>
                            </div>
                        </div>
                    </div>`;
            } else if(tipo === 'suporte') {
                container.innerHTML = `<div class=\"suporte-clean\"><div class=\"suporte-fundo\" style=\"background: url('banner.webp') no-repeat center center; background-size: cover; filter: brightness(0.3);\"></div><div class=\"suporte-content\"><h1>Suporte</h1><div class=\"suporte-card\"><div class=\"suporte-label\">E-mail</div><div class=\"suporte-email\">suportebook@portalpleno.com.br</div></div></div></div>`;
            }
            historico = 'info';
        }

        function renderReview(r) { return `<div class="card-review"><div class="stars">${r.rating}</div><div class="text">"${r.text}"</div><div class="author-info"><strong>${r.author}</strong><br>${r.email} | ${r.book}</div></div>`; }
        function copiarEmail(email) { navigator.clipboard.writeText(email).then(() => alert('E-mail copiado!')); }

        window.onload = () => {
            initAnimation();
            irHome();
            setTimeout(() => {
                document.getElementById('preloader').classList.add('fade-out');
            }, 1000);
        };

        window.addEventListener('resize', () => {
            if (renderer) {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            }
        });
    </script>
</body>
</html>
