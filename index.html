<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "vxqqwilkqh");
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pleno | O Código</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --bg-black: #000;
            --white: #fff;
            --bg-light: #f9f9f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-black);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
            width: 100%;
        }

        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 9999;
            opacity: 1;
            visibility: visible;
            transition: opacity 1s ease, visibility 1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
        }

        #preloader.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #p5-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--gold);
            text-decoration: none;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .home-content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            width: 100%;
        }

        .home-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 10vw, 5rem);
            margin-bottom: 20px;
            color: var(--gold);
        }

        .section {
            padding: 100px 20px;
            width: 100%;
            max-width: 100vw;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background-color: var(--gold);
            color: var(--bg-black);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .section { padding: 60px 20px; }
            .home-content h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div id="preloader">Clique para Iniciar</div>
    <nav>
        <a href="#" class="logo">PORTAL PLENO</a>
        <div class="nav-links">
            <a href="#sobre">Sobre</a>
            <a href="#contato">Contato</a>
            <a href="#suporte">Suporte</a>
        </div>
    </nav>
    <div id="p5-canvas"></div>
    <section class="home-content">
        <h1>O CÓDIGO</h1>
        <p>A Engenharia de Comportamento para quem busca Soberania Intelectual.</p>
        <a href="#sobre" class="cta-button">Descobrir</a>
    </section>
    <section id="sobre" class="section">
        <div class="container">
            <div class="grid">
                <div class="card">
                    <h3>Soberania</h3>
                    <p>Retome o controle dos seus processos cognitivos.</p>
                </div>
                <div class="card">
                    <h3>Engenharia</h3>
                    <p>Sistemas práticos para moldar hábitos.</p>
                </div>
            </div>
        </div>
    </section>
    <section id="contato" class="section" style="background: var(--bg-light); color: var(--bg-black);">
        <div class="container" style="text-align: center;">
            <h2>Contato Direto</h2>
            <a href="https://wa.me/SEUNUMERO" class="cta-button">WhatsApp</a>
        </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let particles = [];
        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('p5-canvas');
            for(let i=0; i<100; i++) particles.push(new Particle());
        }
        function draw() {
            clear();
            background(0, 150);
            particles.forEach(p => { p.update(); p.draw(); });
        }
        class Particle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(random(-0.5, 0.5), random(-0.5, 0.5));
            }
            update() {
                this.pos.add(this.vel);
                if(this.pos.x > width || this.pos.x < 0) this.vel.x *= -1;
                if(this.pos.y > height || this.pos.y < 0) this.vel.y *= -1;
            }
            draw() {
                noStroke();
                fill(255, 215, 0, 150);
                circle(this.pos.x, this.pos.y, 2);
            }
        }
        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
        document.getElementById('preloader').addEventListener('click', function() {
            this.classList.add('fade-out');
        });
    </script>
</body>
</html>
